name: CI

# Runs the tests and builds for every part of ContractIQ on each push and pull request.
# No secrets are used: the backend tests start their own MySQL with Testcontainers, the AI is the
# built-in mock, and the other parts need nothing from outside.

on:
  push:
  pull_request:

# The workflow can only read the repository. Nothing here writes to it or to any other service.
permissions:
  contents: read

# A newer run on the same branch or pull request cancels the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a full commit SHA (the comment names the release), so a moved or hijacked
# tag cannot change what runs. Update them deliberately.
jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Includes the Testcontainers integration tests: GitHub's Ubuntu runners have Docker.
      - name: Build and test
        working-directory: backend
        run: mvn -B verify

      - name: Keep the test reports if something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (exact versions from the lockfile)
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  mcp-server:
    name: MCP server (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            mcp-server/requirements.txt
            mcp-server/requirements-dev.txt

      - name: Install (pinned versions)
        working-directory: mcp-server
        run: python -m pip install -r requirements-dev.txt

      - name: Test
        working-directory: mcp-server
        run: python -m pytest

  docker:
    name: Backend image (build only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Proves the Dockerfile still builds. The image is not pushed anywhere.
      - name: Build the image
        run: docker build --tag contractiq-backend:ci backend
