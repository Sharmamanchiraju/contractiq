spring:
  application:
    name: contractiq-backend
  datasource:
    # Compose maps MySQL to host port 3307. The password has no default on purpose.
    url: ${DB_URL:jdbc:mysql://localhost:3307/contractiq}
    username: ${MYSQL_USER:contractiq}
    password: ${MYSQL_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  autoconfigure:
    # We authenticate with our own JWT filter; skip Boot's generated default user and password.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  # Enabled only in the dev profile (application-dev.yml).
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    # Read from the environment. Must be at least 32 bytes outside the dev profile.
    secret: ${JWT_SECRET:}
    expiry-minutes: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  limits:
    max-request-bytes: 1048576
