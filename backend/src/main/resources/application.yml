spring:
  application:
    name: contractiq-backend
  datasource:
    # Compose maps MySQL to host port 3307. The password has no default on purpose.
    url: ${DB_URL:jdbc:mysql://localhost:3307/contractiq}
    username: ${MYSQL_USER:contractiq}
    password: ${MYSQL_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  autoconfigure:
    # We authenticate with our own JWT filter; skip Boot's generated default user and password.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

logging:
  pattern:
    # Adds the request id to every log line, to match a log line with an audit entry.
    level: "%5p [%X{requestId:-}]"

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  # Enabled only in the dev profile (application-dev.yml).
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    # Read from the environment. Must be at least 32 bytes outside the dev profile.
    secret: ${JWT_SECRET:}
    expiry-minutes: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  limits:
    max-request-bytes: 1048576
  security:
    login:
      # Failed logins allowed per username and per network address within the window, then HTTP 429.
      # In memory only: resets on restart and is not shared between instances (see docs/SECURITY.md).
      max-failures: 5
      window: 15m
      max-tracked-keys: 10000
  ai:
    # mock = rule-based analyzer, no network and no key needed. claude = the real API.
    provider: ${AI_PROVIDER:mock}
    # An analysis stuck in ANALYZING for longer than this (e.g. the app crashed) may be restarted.
    stale-analysis-timeout: 10m
    redaction:
      enabled: true
    claude:
      # Used only when provider=claude. The key and the model come from the environment.
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${CLAUDE_MODEL:claude-sonnet-5-5}
      base-url: https://api.anthropic.com
      anthropic-version: 2026-10-21
      workspace-id: ${ANTHROPIC_WORKSPACE_ID:}
    executor:
      core-size: 2
      max-size: 4
      queue-capacity: 25
