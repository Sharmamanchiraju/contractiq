spring:
  application:
    name: contractiq-backend
  datasource:
    # Compose maps MySQL to host port 3307. The password has no default on purpose.
    url: ${DB_URL:jdbc:mysql://localhost:3307/contractiq}
    username: ${MYSQL_USER:contractiq}
    password: ${MYSQL_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
